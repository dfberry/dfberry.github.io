<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Background -->
  <rect width="700" height="400" fill="#1a1a2e" rx="12"/>
  
  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Scope Comparison: Per-Tool Files vs. Personal Context</text>
  
  <!-- Outermost ring (Personal Context) -->
  <ellipse cx="350" cy="220" rx="290" ry="160" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="350" y="72" text-anchor="middle" fill="#27ae60" font-size="13" font-weight="700">Personal Context Repo</text>
  <text x="350" y="90" text-anchor="middle" fill="#52b788" font-size="10">All projects • All tools • All time</text>
  
  <!-- Middle ring (copilot-instructions) -->
  <ellipse cx="350" cy="230" rx="185" ry="105" fill="none" stroke="#4a90d9" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="350" y="135" text-anchor="middle" fill="#4a90d9" font-size="12" font-weight="600">copilot-instructions.md</text>
  <text x="350" y="152" text-anchor="middle" fill="#5dade2" font-size="9">One repo • One tool family</text>
  
  <!-- Innermost ring (per-tool files) -->
  <ellipse cx="350" cy="240" rx="100" ry="60" fill="none" stroke="#9b59b6" stroke-width="2"/>
  <text x="350" y="230" text-anchor="middle" fill="#dda0dd" font-size="11" font-weight="600">.cursorrules</text>
  <text x="350" y="248" text-anchor="middle" fill="#dda0dd" font-size="11" font-weight="600">CLAUDE.md</text>
  <text x="350" y="268" text-anchor="middle" fill="#af7ac5" font-size="9">One project • One tool</text>
  
  <!-- Scope arrow on right -->
  <line x1="660" y1="300" x2="660" y2="100" stroke="#e0e0e0" stroke-width="2" marker-end="url(#scopeArrow)"/>
  <defs>
    <marker id="scopeArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e0e0e0"/>
    </marker>
  </defs>
  <text x="660" y="90" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="600">BROADER</text>
  <text x="660" y="318" text-anchor="middle" fill="#9b59b6" font-size="10">NARROWER</text>
  
  <!-- Legend at bottom -->
  <rect x="100" y="365" width="14" height="3" fill="#9b59b6" rx="1"/>
  <text x="120" y="369" fill="#999" font-size="9">Per-tool (one project, one tool)</text>
  <rect x="290" y="365" width="14" height="3" fill="#4a90d9" rx="1"/>
  <text x="310" y="369" fill="#999" font-size="9">Repo-level (one repo, one family)</text>
  <rect x="495" y="365" width="14" height="3" fill="#27ae60" rx="1"/>
  <text x="515" y="369" fill="#999" font-size="9">Personal (all projects, all tools)</text>
</svg>
