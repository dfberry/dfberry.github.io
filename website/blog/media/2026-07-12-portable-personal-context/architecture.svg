<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="500" fill="#1a1a2e" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="600">Portable Context: One Repo, Every Surface</text>
  
  <!-- Central repo (GitHub) -->
  <rect x="310" y="60" width="280" height="180" rx="12" fill="#1e3a5f" stroke="#4a90d9" stroke-width="3"/>
  <text x="450" y="90" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">📦 personal-context</text>
  <text x="450" y="112" text-anchor="middle" fill="#8ab4f8" font-size="11">Private GitHub Repository</text>
  
  <!-- Files inside repo -->
  <text x="340" y="140" fill="#a8d8a8" font-size="11">📄 core/expertise.md</text>
  <text x="340" y="158" fill="#a8d8a8" font-size="11">📄 core/boundaries.md</text>
  <text x="340" y="176" fill="#f8d87a" font-size="11">📄 decisions/_active.md</text>
  <text x="340" y="194" fill="#87ceeb" font-size="11">📄 process/quality-bar.md</text>
  <text x="340" y="212" fill="#dda0dd" font-size="11">📄 active/sprint-focus.md</text>
  <text x="340" y="230" fill="#ccc" font-size="11">📄 context.json (index)</text>
  
  <!-- Surfaces at bottom -->
  <!-- VS Code -->
  <rect x="40" y="350" width="150" height="80" rx="8" fill="#2d4a7a" stroke="#4a90d9" stroke-width="2"/>
  <text x="115" y="380" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Copilot in</text>
  <text x="115" y="398" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">VS Code</text>
  <text x="115" y="418" text-anchor="middle" fill="#8ab4f8" font-size="9">reads + writes</text>
  
  <!-- CLI -->
  <rect x="220" y="350" width="150" height="80" rx="8" fill="#2d4a7a" stroke="#4a90d9" stroke-width="2"/>
  <text x="295" y="385" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Copilot CLI</text>
  <text x="295" y="418" text-anchor="middle" fill="#8ab4f8" font-size="9">reads</text>
  
  <!-- Scout -->
  <rect x="400" y="350" width="150" height="80" rx="8" fill="#2d4a7a" stroke="#4a90d9" stroke-width="2"/>
  <text x="475" y="385" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Microsoft Scout</text>
  <text x="475" y="418" text-anchor="middle" fill="#8ab4f8" font-size="9">reads + writes</text>
  
  <!-- M365 -->
  <rect x="580" y="350" width="150" height="80" rx="8" fill="#2d4a7a" stroke="#4a90d9" stroke-width="2"/>
  <text x="655" y="385" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">M365 Copilot</text>
  <text x="655" y="418" text-anchor="middle" fill="#8ab4f8" font-size="9">reads via OneDrive</text>
  
  <!-- Cloud Agent -->
  <rect x="760" y="350" width="110" height="80" rx="8" fill="#2d4a7a" stroke="#4a90d9" stroke-width="2"/>
  <text x="815" y="380" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Cloud</text>
  <text x="815" y="398" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Agent</text>
  <text x="815" y="418" text-anchor="middle" fill="#8ab4f8" font-size="9">reads via API</text>
  
  <!-- Connection arrows from repo to surfaces -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/>
    </marker>
    <marker id="arrowup" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Down arrows (read) -->
  <line x1="350" y1="240" x2="115" y2="348" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="240" x2="295" y2="348" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="240" x2="475" y2="348" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="240" x2="655" y2="348" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="240" x2="815" y2="348" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Up arrows (write-back) for VS Code, Scout -->
  <line x1="130" y1="350" x2="360" y2="242" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowup)"/>
  <line x1="490" y1="350" x2="460" y2="242" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowup)"/>
  
  <!-- Legend -->
  <rect x="250" y="460" width="12" height="3" fill="#4a90d9"/>
  <text x="270" y="464" fill="#999" font-size="11">Read (all surfaces)</text>
  <rect x="420" y="460" width="12" height="3" fill="#27ae60" stroke-dasharray="5,3"/>
  <line x1="420" y1="461" x2="432" y2="461" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="440" y="464" fill="#999" font-size="11">Write back (decisions, state)</text>
</svg>
