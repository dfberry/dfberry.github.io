<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Split responsibilities between overloaded agent file, skill, agent, MCP, and hook layers</title>
  <desc id="desc">A diagram showing that a difficult task is split by moving reusable procedures to a skill, coordination to an agent, external access to MCP, and guarding rules to a hook.</desc>
  <defs>
    <style>
      .bg { fill: #f5f5f3; }
      .left { fill: #f3dfe1; stroke: #516a73; stroke-width: 2.2; }
      .agent { fill: #dfeaf7; stroke: #4d6b8a; stroke-width: 2.2; }
      .skill { fill: #dfeee4; stroke: #4d7d60; stroke-width: 2.2; }
      .mcp { fill: #f3ebcc; stroke: #8a7a35; stroke-width: 2.2; }
      .hook { fill: #e9dff4; stroke: #5f4d84; stroke-width: 2.2; }
      .main { font: 700 30px 'Segoe UI', sans-serif; fill: #1b2733; }
      .label { font: 700 31px 'Segoe UI', sans-serif; fill: #1b2733; }
      .small { font: 500 20px 'Segoe UI', sans-serif; fill: #334155; }
      .list { font: 500 20px 'Segoe UI', sans-serif; fill: #334155; }
      .split { font: 700 26px 'Segoe UI', sans-serif; fill: #23334d; }
      .arrow { stroke: #2f3d52; stroke-width: 5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="16" markerHeight="16" refX="12" refY="4" orient="auto">
      <path d="M0,0 L0,8 L12,4 z" fill="#2f3d52" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text x="640" y="70" text-anchor="middle" class="main">Move each responsibility to the layer that owns it</text>

  <rect class="left" x="80" y="130" width="320" height="440" rx="22"/>
  <text x="240" y="185" text-anchor="middle" class="label">Overloaded agent file</text>
  <text x="145" y="240" class="list">• Specialist role</text>
  <text x="145" y="280" class="list">• Repeatable procedure</text>
  <text x="145" y="320" class="list">• External service calls</text>
  <text x="145" y="360" class="list">• Mandatory safety checks</text>
  <text x="145" y="400" class="list">• Templates and examples</text>
  <text x="145" y="440" class="list">• Tool and handoff policy</text>

  <text x="505" y="338" text-anchor="middle" class="split">split</text>
  <path d="M420 370 L610 370" class="arrow"/>

  <rect class="agent" x="650" y="150" width="240" height="145" rx="20"/>
  <text x="770" y="210" text-anchor="middle" class="label">Agent</text>
  <text x="770" y="245" text-anchor="middle" class="small">Role, tools, context</text>
  <text x="770" y="272" text-anchor="middle" class="small">and handoff</text>

  <rect class="skill" x="960" y="150" width="240" height="145" rx="20"/>
  <text x="1080" y="210" text-anchor="middle" class="label">Skill</text>
  <text x="1080" y="245" text-anchor="middle" class="small">Procedure, templates</text>
  <text x="1080" y="272" text-anchor="middle" class="small">and examples</text>

  <rect class="mcp" x="650" y="370" width="240" height="150" rx="20"/>
  <text x="770" y="430" text-anchor="middle" class="label">MCP</text>
  <text x="770" y="465" text-anchor="middle" class="small">External system</text>
  <text x="770" y="492" text-anchor="middle" class="small">access</text>

  <rect class="hook" x="960" y="370" width="240" height="150" rx="20"/>
  <text x="1080" y="430" text-anchor="middle" class="label">Hook</text>
  <text x="1080" y="465" text-anchor="middle" class="small">Mandatory checks</text>
  <text x="1080" y="492" text-anchor="middle" class="small">and blocking rules</text>
</svg>
