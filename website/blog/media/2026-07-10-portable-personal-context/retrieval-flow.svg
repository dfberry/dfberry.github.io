<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Background -->
  <rect width="800" height="350" fill="#1a1a2e" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="600">Selective Retrieval: Load Only What's Relevant</text>
  
  <!-- Step 1: Read manifest -->
  <rect x="30" y="70" width="160" height="60" rx="8" fill="#2d4a7a" stroke="#4a90d9" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">1. Read context.json</text>
  <text x="110" y="115" text-anchor="middle" fill="#8ab4f8" font-size="10">&lt; 1KB manifest</text>
  
  <!-- Arrow -->
  <line x1="190" y1="100" x2="220" y2="100" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow1)"/>
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a90d9"/>
    </marker>
  </defs>
  
  <!-- Step 2: Always load -->
  <rect x="225" y="70" width="160" height="60" rx="8" fill="#1b4332" stroke="#2d6a4f" stroke-width="2"/>
  <text x="305" y="90" text-anchor="middle" fill="#a8d8a8" font-size="11" font-weight="600">2. Always load</text>
  <text x="305" y="108" text-anchor="middle" fill="#52b788" font-size="9">boundaries.md (~200w)</text>
  <text x="305" y="122" text-anchor="middle" fill="#52b788" font-size="9">communication.md (~200w)</text>
  
  <!-- Arrow -->
  <line x1="385" y1="100" x2="415" y2="100" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow1)"/>
  
  <!-- Step 3: Classify task -->
  <rect x="420" y="70" width="160" height="60" rx="8" fill="#3d2c1e" stroke="#d4a039" stroke-width="2"/>
  <text x="500" y="90" text-anchor="middle" fill="#f8d87a" font-size="11" font-weight="600">3. Classify task</text>
  <text x="500" y="108" text-anchor="middle" fill="#d4a039" font-size="9">"reviewing a PR" →</text>
  <text x="500" y="122" text-anchor="middle" fill="#d4a039" font-size="9">match to load_by_task</text>
  
  <!-- Arrow -->
  <line x1="580" y1="100" x2="610" y2="100" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow1)"/>
  
  <!-- Step 4: Load task files -->
  <rect x="615" y="70" width="160" height="60" rx="8" fill="#1a3a4a" stroke="#4a90d9" stroke-width="2"/>
  <text x="695" y="90" text-anchor="middle" fill="#87ceeb" font-size="11" font-weight="600">4. Load task files</text>
  <text x="695" y="108" text-anchor="middle" fill="#5dade2" font-size="9">quality-bar.md (~150w)</text>
  <text x="695" y="122" text-anchor="middle" fill="#5dade2" font-size="9">pr-standards.md (~150w)</text>
  
  <!-- Result box -->
  <rect x="200" y="180" width="400" height="100" rx="12" fill="#162447" stroke="#e74c3c" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Total Context Injected</text>
  <text x="400" y="240" text-anchor="middle" fill="#e74c3c" font-size="20" font-weight="700">~1,200 tokens</text>
  <text x="400" y="265" text-anchor="middle" fill="#999" font-size="11">(not 25,000 tokens from dumping everything)</text>
  
  <!-- Comparison bar chart at bottom -->
  <text x="150" y="315" text-anchor="middle" fill="#999" font-size="11">Full repo dump:</text>
  <rect x="220" y="305" width="500" height="16" rx="4" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="1"/>
  <text x="740" y="317" fill="#e74c3c" font-size="10">~25K tokens</text>
  
  <text x="150" y="340" text-anchor="middle" fill="#999" font-size="11">Selective retrieval:</text>
  <rect x="220" y="330" width="24" height="16" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="1"/>
  <text x="260" y="342" fill="#27ae60" font-size="10">~1.2K tokens (95% smaller)</text>
</svg>
