<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="480" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="600">Context Broker: From Flat Repo to Hosted Service</text>

  <!-- Left side: Context Layers (input) -->
  <text x="110" y="75" text-anchor="middle" fill="#999" font-size="12" font-weight="600">CONTEXT LAYERS</text>

  <rect x="30" y="90" width="160" height="38" rx="6" fill="#1e3a2e" stroke="#27ae60" stroke-width="1.5"/>
  <text x="110" y="114" text-anchor="middle" fill="#a8d8a8" font-size="12">📄 core/*</text>

  <rect x="30" y="135" width="160" height="38" rx="6" fill="#3a351e" stroke="#f39c12" stroke-width="1.5"/>
  <text x="110" y="159" text-anchor="middle" fill="#f5d98e" font-size="12">📄 decisions/*</text>

  <rect x="30" y="180" width="160" height="38" rx="6" fill="#1e2a3a" stroke="#3498db" stroke-width="1.5"/>
  <text x="110" y="204" text-anchor="middle" fill="#87ceeb" font-size="12">📄 process/*</text>

  <rect x="30" y="225" width="160" height="38" rx="6" fill="#2a1e3a" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="110" y="249" text-anchor="middle" fill="#dda0dd" font-size="12">📄 active/*</text>

  <!-- Arrows from layers to broker -->
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a90d9"/>
    </marker>
    <marker id="arwR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>

  <line x1="195" y1="109" x2="270" y2="170" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="195" y1="154" x2="270" y2="180" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="195" y1="199" x2="270" y2="195" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="195" y1="244" x2="270" y2="210" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Central: Context Broker (4 jobs) -->
  <rect x="275" y="80" width="350" height="210" rx="12" fill="#16213e" stroke="#4a90d9" stroke-width="3"/>
  <text x="450" y="108" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Context Broker</text>
  <text x="450" y="126" text-anchor="middle" fill="#8ab4f8" font-size="11">REST/OpenAPI service (source of truth)</text>

  <!-- 4 jobs as sub-boxes -->
  <rect x="295" y="140" width="145" height="50" rx="6" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1"/>
  <text x="367" y="161" text-anchor="middle" fill="#8ab4f8" font-size="11" font-weight="600">1. Merge</text>
  <text x="367" y="180" text-anchor="middle" fill="#ccc" font-size="9">Combine all layers</text>

  <rect x="460" y="140" width="145" height="50" rx="6" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1"/>
  <text x="532" y="161" text-anchor="middle" fill="#8ab4f8" font-size="11" font-weight="600">2. Priority</text>
  <text x="532" y="180" text-anchor="middle" fill="#ccc" font-size="9">Resolve conflicts</text>

  <rect x="295" y="200" width="145" height="50" rx="6" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1"/>
  <text x="367" y="221" text-anchor="middle" fill="#8ab4f8" font-size="11" font-weight="600">3. Redact</text>
  <text x="367" y="240" text-anchor="middle" fill="#ccc" font-size="9">Filter by trust tier</text>

  <rect x="460" y="200" width="145" height="50" rx="6" fill="#3a1e1e" stroke="#e74c3c" stroke-width="1"/>
  <text x="532" y="221" text-anchor="middle" fill="#e8a0a0" font-size="11" font-weight="600">4. Scan</text>
  <text x="532" y="240" text-anchor="middle" fill="#ccc" font-size="9">Block exfiltration</text>

  <!-- Right side: MCP Facade -->
  <rect x="670" y="110" width="190" height="155" rx="10" fill="#1a1a2e" stroke="#9b59b6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="765" y="140" text-anchor="middle" fill="#c39bd3" font-size="13" font-weight="600">MCP Facade</text>
  <text x="765" y="158" text-anchor="middle" fill="#999" font-size="10">(thin, swappable)</text>

  <!-- Surface boxes inside MCP facade -->
  <rect x="690" y="170" width="148" height="28" rx="4" fill="#2d4a7a" stroke="#4a90d9" stroke-width="1"/>
  <text x="764" y="189" text-anchor="middle" fill="#fff" font-size="10">VS Code / CLI / Foundry</text>

  <rect x="690" y="205" width="148" height="28" rx="4" fill="#4a2d5e" stroke="#9b59b6" stroke-width="1"/>
  <text x="764" y="224" text-anchor="middle" fill="#fff" font-size="10">Claude / ChatGPT</text>

  <!-- Arrow from broker to facade -->
  <line x1="630" y1="190" x2="665" y2="190" stroke="#9b59b6" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Bottom: Trust tiers -->
  <text x="450" y="320" text-anchor="middle" fill="#999" font-size="12" font-weight="600">TRUST TIERS (server-enforced redaction)</text>

  <rect x="100" y="340" width="200" height="60" rx="8" fill="#1e3a2e" stroke="#27ae60" stroke-width="1.5"/>
  <text x="200" y="365" text-anchor="middle" fill="#2ecc71" font-size="13" font-weight="600">🟢 Public</text>
  <text x="200" y="385" text-anchor="middle" fill="#ccc" font-size="10">Role, expertise, preferences</text>

  <rect x="350" y="340" width="200" height="60" rx="8" fill="#2d3a1e" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450" y="365" text-anchor="middle" fill="#f39c12" font-size="13" font-weight="600">🟡 Work</text>
  <text x="450" y="385" text-anchor="middle" fill="#ccc" font-size="10">Sprint focus, decisions, process</text>

  <rect x="600" y="340" width="200" height="60" rx="8" fill="#3a1e1e" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="700" y="365" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="600">🔴 Private</text>
  <text x="700" y="385" text-anchor="middle" fill="#ccc" font-size="10">Boundaries, sensitive decisions</text>

  <!-- Key architecture call -->
  <rect x="140" y="420" width="620" height="35" rx="6" fill="#16213e" stroke="#4a90d9" stroke-width="1"/>
  <text x="450" y="442" text-anchor="middle" fill="#8ab4f8" font-size="12" font-weight="600">Build the contract you can't rewrite in REST. Expose MCP as a facade you can throw away.</text>
</svg>
