<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="380" fill="#1a1a2e" rx="12"/>
  
  <!-- Divider -->
  <line x1="450" y1="40" x2="450" y2="360" stroke="#444" stroke-width="2"/>
  
  <!-- BEFORE side -->
  <text x="225" y="35" text-anchor="middle" fill="#e74c3c" font-size="16" font-weight="700">BEFORE</text>
  
  <!-- User icon -->
  <circle cx="100" cy="190" r="25" fill="#3d2020" stroke="#e74c3c" stroke-width="2"/>
  <text x="100" y="196" text-anchor="middle" fill="#e74c3c" font-size="20">👤</text>
  
  <!-- Speech bubbles (repeating) -->
  <rect x="140" y="70" width="180" height="28" rx="6" fill="#3d2020" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="89" text-anchor="middle" fill="#fca5a5" font-size="8">"I prefer concise output..."</text>
  
  <rect x="140" y="110" width="180" height="28" rx="6" fill="#3d2020" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="129" text-anchor="middle" fill="#fca5a5" font-size="8">"I prefer concise output..."</text>
  
  <rect x="140" y="150" width="180" height="28" rx="6" fill="#3d2020" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="169" text-anchor="middle" fill="#fca5a5" font-size="8">"Use fork-first workflow..."</text>
  
  <rect x="140" y="190" width="180" height="28" rx="6" fill="#3d2020" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="209" text-anchor="middle" fill="#fca5a5" font-size="8">"Use fork-first workflow..."</text>
  
  <rect x="140" y="230" width="180" height="28" rx="6" fill="#3d2020" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="249" text-anchor="middle" fill="#fca5a5" font-size="8">"We decided to use pipeline..."</text>
  
  <rect x="140" y="270" width="180" height="28" rx="6" fill="#3d2020" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="289" text-anchor="middle" fill="#fca5a5" font-size="8">"We decided to use pipeline..."</text>
  
  <!-- Tool icons (confused) -->
  <text x="350" y="89" fill="#e74c3c" font-size="12">❓ VS Code</text>
  <text x="350" y="129" fill="#e74c3c" font-size="12">❓ Scout</text>
  <text x="350" y="169" fill="#e74c3c" font-size="12">❓ CLI</text>
  <text x="350" y="209" fill="#e74c3c" font-size="12">❓ Claude</text>
  <text x="350" y="249" fill="#e74c3c" font-size="12">❓ VS Code</text>
  <text x="350" y="289" fill="#e74c3c" font-size="12">❓ M365</text>
  
  <!-- Arrows from user to each -->
  <line x1="125" y1="180" x2="140" y2="84" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="185" x2="140" y2="124" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="190" x2="140" y2="164" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="195" x2="140" y2="204" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="200" x2="140" y2="244" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="205" x2="140" y2="284" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
  
  <!-- Before label -->
  <text x="225" y="340" text-anchor="middle" fill="#e74c3c" font-size="10">Repeating yourself to every tool, every session</text>
  
  <!-- AFTER side -->
  <text x="675" y="35" text-anchor="middle" fill="#27ae60" font-size="16" font-weight="700">AFTER</text>
  
  <!-- User icon -->
  <circle cx="520" cy="190" r="25" fill="#1b3320" stroke="#27ae60" stroke-width="2"/>
  <text x="520" y="196" text-anchor="middle" fill="#27ae60" font-size="20">👤</text>
  
  <!-- Single arrow to repo -->
  <line x1="545" y1="190" x2="610" y2="190" stroke="#27ae60" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <defs>
    <marker id="greenArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Repo -->
  <rect x="615" y="162" width="100" height="56" rx="8" fill="#1b4332" stroke="#27ae60" stroke-width="2.5"/>
  <text x="665" y="185" text-anchor="middle" fill="#a8d8a8" font-size="9" font-weight="600">personal-</text>
  <text x="665" y="198" text-anchor="middle" fill="#a8d8a8" font-size="9" font-weight="600">context</text>
  <text x="665" y="212" text-anchor="middle" fill="#52b788" font-size="8">📦 repo</text>
  
  <!-- Arrows from repo to tools -->
  <line x1="715" y1="170" x2="770" y2="90" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="715" y1="178" x2="770" y2="140" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="715" y1="190" x2="770" y2="190" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="715" y1="202" x2="770" y2="240" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="715" y1="210" x2="770" y2="290" stroke="#27ae60" stroke-width="1.5"/>
  
  <!-- Tools with checkmarks -->
  <text x="775" y="94" fill="#27ae60" font-size="11">✓ VS Code</text>
  <text x="775" y="144" fill="#27ae60" font-size="11">✓ Scout</text>
  <text x="775" y="194" fill="#27ae60" font-size="11">✓ CLI</text>
  <text x="775" y="244" fill="#27ae60" font-size="11">✓ Claude</text>
  <text x="775" y="294" fill="#27ae60" font-size="11">✓ M365</text>
  
  <!-- After label -->
  <text x="675" y="340" text-anchor="middle" fill="#27ae60" font-size="10">Write once → every surface knows you</text>
  
  <!-- Bottom comparison -->
  <text x="225" y="365" text-anchor="middle" fill="#666" font-size="9">One-to-one (exhausting)</text>
  <text x="675" y="365" text-anchor="middle" fill="#666" font-size="9">One-to-many (effortless)</text>
</svg>
