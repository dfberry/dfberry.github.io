<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Background -->
  <rect width="500" height="320" fill="#1a1a2e" rx="12"/>
  
  <!-- Title -->
  <text x="250" y="35" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="600">Priority Stack: When Things Conflict</text>
  
  <!-- Stack layers (bottom to top = lowest to highest priority) -->
  
  <!-- Layer 4 (bottom): Active -->
  <rect x="80" y="240" width="340" height="50" rx="6" fill="#3d1e3d" stroke="#9b59b6" stroke-width="2"/>
  <text x="250" y="262" text-anchor="middle" fill="#dda0dd" font-size="13" font-weight="600">active/*</text>
  <text x="250" y="280" text-anchor="middle" fill="#af7ac5" font-size="10">Informational. Not authoritative.</text>
  <text x="440" y="268" fill="#666" font-size="11">④</text>
  
  <!-- Layer 3: Process -->
  <rect x="80" y="180" width="340" height="50" rx="6" fill="#1a3a4a" stroke="#4a90d9" stroke-width="2"/>
  <text x="250" y="202" text-anchor="middle" fill="#87ceeb" font-size="13" font-weight="600">process/*</text>
  <text x="250" y="220" text-anchor="middle" fill="#5dade2" font-size="10">Follow unless user overrides in-session.</text>
  <text x="440" y="208" fill="#666" font-size="11">③</text>
  
  <!-- Layer 2: Decisions -->
  <rect x="80" y="120" width="340" height="50" rx="6" fill="#3d2c1e" stroke="#d4a039" stroke-width="2"/>
  <text x="250" y="142" text-anchor="middle" fill="#f8d87a" font-size="13" font-weight="600">decisions/_active.md</text>
  <text x="250" y="160" text-anchor="middle" fill="#d4a039" font-size="10">Settled questions. Don't re-ask.</text>
  <text x="440" y="148" fill="#666" font-size="11">②</text>
  
  <!-- Layer 1 (top): Core/Boundaries -->
  <rect x="80" y="60" width="340" height="50" rx="6" fill="#1b4332" stroke="#27ae60" stroke-width="3"/>
  <text x="250" y="82" text-anchor="middle" fill="#a8d8a8" font-size="13" font-weight="700">core/boundaries.md</text>
  <text x="250" y="100" text-anchor="middle" fill="#52b788" font-size="10">ALWAYS wins. Non-negotiable.</text>
  <text x="440" y="88" fill="#27ae60" font-size="11">①</text>
  
  <!-- Priority arrow on right -->
  <line x1="460" y1="275" x2="460" y2="75" stroke="#e74c3c" stroke-width="3" marker-end="url(#priorityArrow)"/>
  <defs>
    <marker id="priorityArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  <text x="476" y="180" fill="#e74c3c" font-size="11" writing-mode="tb">PRIORITY</text>
  
  <!-- Footer -->
  <text x="250" y="308" text-anchor="middle" fill="#666" font-size="10">Higher layers always override lower layers in case of conflict.</text>
</svg>
