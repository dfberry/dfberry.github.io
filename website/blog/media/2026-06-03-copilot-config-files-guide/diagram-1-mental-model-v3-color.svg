<svg xmlns="http://www.w3.org/2000/svg" width="100%"  viewBox="0 0 807 646" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Layers of Governance</title>
  <desc id="desc">A monochrome governance mental model with instructions above the rings, agents to the right, skills to the lower left, and a three-line center summary inside the inner circle.</desc>
  <defs>
    <style>
      .canvas { font-family: Arial, Helvetica, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .stroke { stroke: #4a6d8c; }
      .panel { fill: #f5f7fa; stroke: #4a6d8c; stroke-width: 2; }
      .connector { fill: none; stroke: #4a6d8c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .panel-title { font-size: 19px; font-weight: 700; letter-spacing: 1.3px; }
      .panel-copy { font-size: 14.5px; font-weight: 500; }
      .center-copy { font-size: 15.5px; font-weight: 500; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15.5px; font-weight: 500; }
      text { fill: #000000; text-anchor: middle; }
    </style>
  </defs>
  <g class="canvas">
    <rect x="0" y="0" width="807" height="646" fill="#ffffff"/>

    <g>
      <rect class="panel" x="252" y="34" width="304" height="82" rx="22"/>
      <text class="panel-title" x="404" y="67">INSTRUCTIONS</text>
      <text class="panel-copy" x="404" y="92">Repo rules and guardrails</text>
      <text class="panel-copy" x="404" y="111">shape the whole space</text>
    </g>

    <g>
      <rect class="panel" x="615" y="234" width="158" height="102" rx="22"/>
      <text class="panel-title" x="694" y="268">AGENTS</text>
      <text class="panel-copy" x="694" y="293">Interpret rules for</text>
      <text class="panel-copy" x="694" y="312">the current context</text>
    </g>

    <g>
      <rect class="panel" x="34" y="392" width="188" height="110" rx="22"/>
      <text class="panel-title" x="128" y="428">SKILLS</text>
      <text class="panel-copy" x="128" y="455">Carry out reusable</text>
      <text class="panel-copy" x="128" y="474">steps and assets</text>
    </g>

    <g fill="none">
      <line class="connector" x1="404" y1="140" x2="404" y2="146"/>
      <path class="connector" d="M615 270 C600 268 586 266 566 259"/>
      <path class="connector" d="M222 422 C233 419 241 414 249 408"/>
    </g>

    <g transform="translate(404 304)">
      <circle r="158" fill="none" class="stroke" stroke-width="2"/>
      <circle r="118" fill="none" class="stroke" stroke-width="2"/>
      <circle r="90" fill="none" class="stroke" stroke-width="1.75"/>

      <text class="center-copy" x="0" y="-18">Instructions set rules.</text>
      <text class="center-copy" x="0" y="6">Agents decide.</text>
      <text class="center-copy" x="0" y="30">Skills execute.</text>
    </g>

    <g transform="translate(404 556)">
      <text class="title" x="0" y="0">Layers of Governance</text>
      <text class="subtitle" x="0" y="33">Rules constrain decisions, then reusable skills carry out the work.</text>
      <g transform="translate(0 69)" fill="#000000">
        <circle cx="-28" cy="0" r="5.5"/>
        <circle cx="0" cy="0" r="5.5"/>
        <circle cx="28" cy="0" r="5.5"/>
      </g>
    </g>
  </g>
</svg>