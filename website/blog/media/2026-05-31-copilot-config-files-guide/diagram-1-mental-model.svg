<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 807 646" role="img" aria-labelledby="title desc" text-rendering="optimizeLegibility">
  <title id="title">Layers of Governance</title>
  <desc id="desc">A mental model showing instructions at the top, agents on the right, and skills on the left around concentric governance rings.</desc>
  <defs>
    <style>
      .canvas {
        font-family: Arial, Helvetica, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .panel-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1.6px;
      }
      .panel-copy {
        font-size: 16px;
        font-weight: 500;
      }
      .ring-label {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2.2px;
      }
      .center-copy {
        font-size: 20px;
        font-weight: 600;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
      }
      .subtitle {
        font-size: 17px;
        font-weight: 500;
      }
      text {
        dominant-baseline: middle;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </defs>

  <g class="canvas">
    <rect x="0" y="0" width="807" height="646" fill="#ffffff"/>

    <g>
      <rect x="273" y="54" width="260" height="108" rx="22" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
      <text x="403" y="89" text-anchor="middle" class="panel-title" fill="#000000">INSTRUCTIONS</text>
      <text x="403" y="121" text-anchor="middle" class="panel-copy" fill="#000000">
        <tspan x="403" dy="0">Set rules and guardrails</tspan>
        <tspan x="403" dy="22">for the whole repo</tspan>
      </text>
    </g>

    <g>
      <rect x="543" y="187" width="230" height="110" rx="22" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
      <text x="658" y="223" text-anchor="middle" class="panel-title" fill="#000000">AGENTS</text>
      <text x="658" y="257" text-anchor="middle" class="panel-copy" fill="#000000">
        <tspan x="658" dy="0">Choose how to apply</tspan>
        <tspan x="658" dy="22">those rules in context</tspan>
      </text>
    </g>

    <g>
      <rect x="34" y="315" width="232" height="116" rx="22" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
      <text x="150" y="353" text-anchor="middle" class="panel-title" fill="#000000">SKILLS</text>
      <text x="150" y="389" text-anchor="middle" class="panel-copy" fill="#000000">
        <tspan x="150" dy="0">Execute reusable work</tspan>
        <tspan x="150" dy="22">with repeatable assets</tspan>
      </text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M403 162 L403 128" stroke="#cccccc" stroke-width="2"/>
      <path d="M571 240 C527 235 500 233 471 233" stroke="#cccccc" stroke-width="2"/>
      <path d="M266 372 C294 354 311 338 330 320" stroke="#cccccc" stroke-width="2"/>
    </g>

    <g transform="translate(403 275)">
      <circle r="176" fill="none" stroke="none"/>
      <circle r="176" fill="none" stroke="#cccccc" stroke-width="2"/>
      <circle r="127" fill="none" stroke="#cccccc" stroke-width="2"/>
      <circle r="84" fill="none" stroke="#cccccc" stroke-width="1.5"/>

      <g>
        <rect x="-69" y="-176" width="138" height="38" rx="19" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
        <text x="0" y="-157" text-anchor="middle" class="ring-label" fill="#000000">AGENTS</text>
      </g>

      <g>
        <rect x="-192" y="69" width="134" height="38" rx="19" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
        <text x="-125" y="88" text-anchor="middle" class="ring-label" fill="#000000">SKILLS</text>
      </g>

      <text x="0" y="-22" text-anchor="middle" class="center-copy" fill="#000000">
        <tspan x="0" dy="0">Instructions set the rules.</tspan>
        <tspan x="0" dy="28">Agents decide.</tspan>
        <tspan x="0" dy="28">Skills execute.</tspan>
      </text>
    </g>

    <g transform="translate(403 548)">
      <text x="0" y="0" text-anchor="middle" class="title" fill="#000000">Layers of Governance</text>
      <text x="0" y="31" text-anchor="middle" class="subtitle" fill="#000000">Rules constrain decisions, then reusable skills carry out the work.</text>
      <g transform="translate(0 62)" fill="#000000">
        <circle cx="-26" cy="0" r="5.5"/>
        <circle cx="0" cy="0" r="5.5"/>
        <circle cx="26" cy="0" r="5.5"/>
      </g>
    </g>
  </g>
</svg>
