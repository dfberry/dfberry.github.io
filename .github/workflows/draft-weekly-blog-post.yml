name: Draft weekly blog post

on:
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Select the oldest open blog issue
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'blog',
              sort: 'created',
              direction: 'asc',
              per_page: 1,
            });

            const issue = data.find((item) => !item.pull_request);
            if (!issue) {
              core.setOutput('found', 'false');
              return;
            }

            core.setOutput('found', 'true');
            core.setOutput('number', String(issue.number));
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');
            core.setOutput('url', issue.html_url);
            core.setOutput('labels', issue.labels.map((label) => label.name).join(','));

      - name: Draft blog post from the selected issue
        if: steps.issue.outputs.found == 'true'
        run: node ../.github/scripts/blog-automation.mjs draft
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          ISSUE_LABELS: ${{ steps.issue.outputs.labels }}

      - name: Open pull request with the draft post
        if: steps.issue.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/blog-draft-${{ steps.issue.outputs.number }}
          commit-message: "chore(blog): draft post from issue #${{ steps.issue.outputs.number }}"
          title: "Draft blog post from issue #${{ steps.issue.outputs.number }}"
          body: |
            Draft a weekly blog post from issue #${{ steps.issue.outputs.number }} so it can be reviewed and refined before publishing.
          labels: blog
